openapi: 3.0.3

info:
  title: OperFi Partner API
  version: "1.0.0"
  description: |
    The OperFi Partner API lets clients and TMS platforms push loads, with
    their paperwork, into OperFi in bulk. OperFi is the source of truth; this
    API is a one-way inbound feeder, not a two-way financial sync.

    ## Base URLs

    | Environment | Base URL | Notes |
    |---|---|---|
    | Sandbox | `https://operfi-broker-api-sandbox.onrender.com/v1` | Live. Start here. Seeded test data, isolated storage, every outbound integration disabled. |
    | Production | `https://operfi-broker-api.onrender.com/v1` | Live. Real loads on a real broker's account. |

    Both environments run **the same code over the same request path**. The only
    differences are where data is stored, that the sandbox cannot reach any
    external system, and two sandbox-only endpoints that are marked as such.
    Anything you certify against the sandbox behaves the same way in production.

    ## Authentication

    Send your API key as a bearer token on every request:

    ```
    Authorization: Bearer sk_live_xxxxxxxxxxxxxxxx
    ```

    Keys are environment-prefixed: `sk_live_` for production, `sk_test_` for the
    sandbox. A key only works in its own environment. Identity (which OperFi
    client you are) is always derived server-side from the key, never from the
    request body.

    ## Sandbox

    The sandbox is a full copy of this API backed by its own isolated storage.
    It never writes to OperFi's systems of record, never contacts a carrier,
    a factoring company, or a payment processor, and cannot move money. Outbound
    network calls are blocked at the process level rather than stubbed, so there
    is no configuration mistake that can make a sandbox request reach production.

    Ask OperFi for a sandbox key at `integrations@operfi.com`. You receive an
    `sk_test_` key and, for Platform partners, an `OperFi-Client-Ref` value.

    ### Seeded data

    Every sandbox account is seeded with the same fixtures, so you can write
    assertions against known values. `GET /v1/customers` and `GET /v1/carriers`
    return exactly these.

    **Customers**

    | `customer_id` | Name | `fv_company_id` | Use it to test |
    |---|---|---|---|
    | `sbx_cust_1` | ACME DISTRIBUTION | `FV-SBX-1001` | The normal path: resolve by FactorView id |
    | `sbx_cust_2` | GLOBEX LOGISTICS | `FV-SBX-1002` | Resolving by id or by name |
    | `sbx_cust_3` | INITECH FREIGHT SERVICES | *(empty)* | A customer with **no** FactorView id, so you must fall back to `customer_name` |

    **Carriers**

    | `carrier_id` | Name | MC / USDOT | Pay terms | Use it to test |
    |---|---|---|---|---|
    | `sbx_carr_1` | BLUE RIDGE TRUCKING | `MC111111` / `1111111` | Net 30 | The normal path |
    | `sbx_carr_2` | CASCADE CARRIERS | `MC222222` / `2222222` | Quick Pay | Resolving by MC or USDOT |
    | `sbx_carr_3` | DELTA FREIGHT LINES | `MC333333` / `3333333` | Factoring Company | A carrier paid through a factor |
    | `sbx_carr_4` | ECHO TRANSPORT | `MC444444` / `4444444` | Net 30 | Flagged **do not use** (`dnu: true`) |

    Useful cases these let you build deliberately: send `carrier_mc` and
    `carrier_usdot` belonging to two *different* carriers to see a conflict go
    unresolved, or send a `customer_fv_id` that does not exist to see
    `customer_fv_id_not_found`.

    ### Sandbox-only endpoints

    - `POST /v1/sandbox/reset`: deletes your account's loads and re-seeds the
      fixtures above. It touches only your own account. Call it between test
      runs.
    - `POST /v1/sandbox/loads/{ref}/advance`: moves a load to a later status so
      you can exercise your polling logic. In production only a broker can do
      this, from inside OperFi.

    Both return `404` in production. They are the only endpoints that differ
    between environments.

    ### What the sandbox does not simulate

    Sandbox loads never actually fund. There is no buyout, no wire, no reserve,
    and no real credit decision: every seeded customer is credit-approved.
    Customer and carrier matching runs against the seeded fixtures only, so it
    exercises the same matcher your production traffic will hit, but over a much
    smaller set of names.

    Settlement is the exception. No money moves, but you can emit a real
    settlement event on demand — paid in full, short paid, charged back, or a
    reversal of a settlement you were already told about — so you can test the
    code that handles one without waiting for a debtor. See
    `POST /sandbox/loads/{ref}/advance`.

    ## Quickstart

    Every command below runs against the **sandbox** and works as written once
    you have a key. Responses are real, not illustrative. Platform partners send
    `OperFi-Client-Ref`; Direct partners omit it.

    ```bash
    export OPERFI_KEY="sk_test_your_key_here"
    export OPERFI_BASE="https://operfi-broker-api-sandbox.onrender.com/v1"
    export OPERFI_CLIENT="SANDBOX-001"   # Platform partners only
    ```

    **1. Look up the client's customers and carriers.** Tag loads with these IDs
    and they land already resolved. Note `fv_company_id`: when a customer has
    one, it is the most reliable way to identify them.

    ```bash
    curl "$OPERFI_BASE/customers"       -H "Authorization: Bearer $OPERFI_KEY"       -H "OperFi-Client-Ref: $OPERFI_CLIENT"
    ```
    ```json
    {
      "data": [
        { "customer_id": "sbx_cust_1", "name": "ACME DISTRIBUTION", "fv_company_id": "FV-SBX-1001", "credit_status": "approved" },
        { "customer_id": "sbx_cust_2", "name": "GLOBEX LOGISTICS", "fv_company_id": "FV-SBX-1002", "credit_status": "approved" },
        { "customer_id": "sbx_cust_3", "name": "INITECH FREIGHT SERVICES", "fv_company_id": "", "credit_status": "approved" }
      ],
      "next_cursor": null
    }
    ```

    **2. Push loads.** Always a batch, even for one. Each lands as a draft.

    ```bash
    curl -X POST "$OPERFI_BASE/loads"       -H "Authorization: Bearer $OPERFI_KEY"       -H "OperFi-Client-Ref: $OPERFI_CLIENT"       -H "Content-Type: application/json"       -d '{
        "loads": [{
          "source_load_ref": "TMS-88231",
          "customer_fv_id": "FV-SBX-1001",
          "carrier_mc": "MC111111",
          "customer_reference_number": "PO-44821",
          "customer_rate": 2400.00,
          "carrier_rate": 2000.00,
          "carrier_factoring_invoice": "INV-55812",
          "load_rate_confirmation_number": "RC-77231"
        }]
      }'
    ```
    ```json
    {
      "results": [
        { "source_load_ref": "TMS-88231", "status": "received", "operfi_load_ref": "4200000000001", "warnings": [] }
      ]
    }
    ```

    `operfi_load_ref` is an opaque numeric string. Store it as text and do not
    parse it. Use it for the next two calls.

    **3. Attach paperwork.**

    ```bash
    curl -X POST "$OPERFI_BASE/loads/4200000000001/documents"       -H "Authorization: Bearer $OPERFI_KEY"       -H "OperFi-Client-Ref: $OPERFI_CLIENT"       -F "document_type=rate_confirmation"       -F "files=@ratecon.pdf"
    ```
    ```json
    { "operfi_load_ref": "4200000000001", "document_type": "rate_confirmation", "uploaded": 1 }
    ```

    **4. Poll the load.** This returns integration status only, never funding
    data. Outstanding items appear in `warnings` and clear as they are satisfied,
    including by the documents you upload.

    **5. Learn when the debtor pays.** Poll `GET /v1/events` from the last
    `next_cursor` you stored. Settlement events tell you whether a load was paid
    in full, short paid, or charged back, and for how much. This is the only
    place financial outcomes appear.

    ```bash
    curl "$OPERFI_BASE/loads/4200000000001"       -H "Authorization: Bearer $OPERFI_KEY"       -H "OperFi-Client-Ref: $OPERFI_CLIENT"
    ```
    ```json
    {
      "operfi_load_ref": "4200000000001",
      "source_load_ref": "TMS-88231",
      "status": "needs_attention",
      "warnings": [
        { "code": "validation_error", "field": "documents", "message": "Carrier documents are required to submit." }
      ]
    }
    ```

    **5. Start over.** Sandbox only.

    ```bash
    curl -X POST "$OPERFI_BASE/sandbox/reset"       -H "Authorization: Bearer $OPERFI_KEY"       -H "OperFi-Client-Ref: $OPERFI_CLIENT"
    ```

    ## Identifying customers and carriers

    You can identify a customer three ways. In precedence order:

    1. **`customer_id`**: the OperFi ID from `GET /v1/customers`. Exact.
    2. **`customer_fv_id`**: the FactorView Company ID, also returned by
       `GET /v1/customers` as `fv_company_id`. Exact, and stable across OperFi
       systems.
    3. **`customer_name`**: matched against the client's on-file customers.

    **An explicit identifier is never treated as a hint.** If you send
    `customer_fv_id` and it does not match, the load still lands, but the
    customer is left unresolved and you get `customer_fv_id_not_found`. We do
    **not** fall back to `customer_name`, even when the name matches exactly.
    Guessing a debtor after a failed ID lookup is how a load ends up billed to
    the wrong company. Send `customer_fv_id` only when you have a real one, and
    send `customer_name` otherwise.

    Not every customer has a FactorView ID. When `fv_company_id` comes back
    empty, use `customer_id` or `customer_name` for that customer.

    Carriers work the same way: `carrier_id` is exact, otherwise `carrier_mc`
    and/or `carrier_usdot` are matched. **If you send both an MC and a USDOT and
    they belong to different carriers on file, the conflict is unresolved on
    purpose** rather than picking one, and the load lands with the carrier blank.

    ## Validation: lenient on create, strict on submit

    A load with an unmatched customer/carrier or missing rates still lands as a
    draft; the gaps come back as `warnings`. Only a malformed payload (for
    example, a missing `source_load_ref`) is `rejected`. The broker resolves any
    warnings and submits the load inside OperFi.

    ## Identity

    Identity is always determined server-side from your API key (and, in
    Platform mode, the `OperFi-Client-Ref` header). It is never read from the
    request body. You cannot push loads on behalf of a client your key is not
    authorized for.

    ## What this API does not do

    There are no outbound webhooks and no payment callbacks. Settlement data is
    delivered by polling `GET /v1/events` — OperFi never posts to an endpoint you
    host. `GET /v1/loads/{ref}` still returns integration status only: money lives
    on the event feed, not on the load.

    ## Authentication modes

    - **Direct**: one API key maps to one OperFi client. The `OperFi-Client-Ref`
      header is ignored.
    - **Platform**: one API key maps to many clients (for TMS platforms). Every
      write must carry `OperFi-Client-Ref`, validated against your key's roster
      before any write occurs.

    ## Errors

    Every 4xx/5xx response uses one envelope:

    ```json
    {
      "error": {
        "code": "validation_error",
        "message": "carrier_rate must be a positive number.",
        "field": "carrier_rate",
        "request_id": "req_01H..."
      }
    }
    ```

    Include the `request_id` when contacting OperFi support.

    ## Warning and error codes

    Codes are stable. Branch on `code`, never on `message`.

    **Warnings** - the draft still exists; a broker resolves these inside OperFi.

    | Code | Field | What it means | What to do |
    |---|---|---|---|
    | `customer_not_resolved` | `customer_name` | The name did not match a credit-approved customer on file. | Send `customer_id` or `customer_fv_id`, or let the broker resolve it. |
    | `customer_fv_id_not_found` | `customer_fv_id` | The FactorView ID matched nothing. **No name fallback is attempted.** | Re-check the ID against `GET /v1/customers`. Send `customer_name` instead if you do not hold a real ID. |
    | `carrier_not_resolved` | `carrier_mc` | No carrier matched, or the MC and USDOT you sent point at two different carriers on file. | Send `carrier_id`, or send only the identifier you trust. |
    | `validation_error` | varies | A field required *to submit* is still missing. The draft exists; it just cannot be submitted yet. | Supply the field, or upload the missing document. |

    **Errors** - returned in the `error` envelope, or per-load under `errors`
    when a load's `status` is `rejected`.

    | Code | HTTP | What it means |
    |---|---|---|
    | `unauthorized` | 401 | Missing, invalid, or wrong-environment key. An `sk_test_` key on production, or an `sk_live_` key on the sandbox, lands here. |
    | `forbidden_client_ref` | 403 | Your key is not authorized for the `OperFi-Client-Ref` you sent. |
    | `load_not_found` | 404 | No load with that reference on this client's account. Also returned for a malformed reference. |
    | `payload_too_large` | 413 | The upload exceeded the size limit. |
    | `validation_error` | 422 | The request or an individual load was malformed. No draft was created for that load. |
    | `rate_limited` | 429 | Slow down and retry after a pause. |
    | `internal_error` | 500 | Something failed on our side. Safe to retry; quote `request_id` if it persists. |

    ## Versioning

    The API is versioned in the path (`/v1`). Additive changes (new optional
    fields, new endpoints) ship within `v1` without breaking. Any breaking
    change ships as `/v2` with `v1` supported in parallel for a published
    deprecation window.

    ## Getting a key

    Email `integrations@operfi.com`. You receive an `sk_test_` key for the
    sandbox immediately; once you have certified against it, you receive an
    `sk_live_` key for production. Keys are secret and can be rotated on
    request. Platform partners have their authorized-client roster provisioned
    by OperFi.
  contact:
    name: OperFi Integrations
    email: integrations@operfi.com

servers:
  - url: https://operfi-broker-api-sandbox.onrender.com/v1
    description: Sandbox. Isolated test environment with seeded data. Start here.
  - url: https://operfi-broker-api.onrender.com/v1
    description: Production. Live loads on a real broker's account.

security:
  - bearerAuth: []

tags:
  - name: Loads
    description: Push loads into OperFi and check their integration status.
  - name: Documents
    description: Attach paperwork to a load.
  - name: Reference data
    description: Look up the client's on-file customers and carriers, with OperFi IDs.
  - name: Settlement
    description: >-
      Learn when a debtor paid a load you pushed, and what actually happened to
      the money.
  - name: Sandbox
    description: >-
      Sandbox-only controls for testing. These return 404 in production and are
      the only endpoints that differ between environments.

paths:
  /loads:
    post:
      tags: [Loads]
      summary: Create loads (batch)
      operationId: createLoads
      description: |
        Push one or more loads. The body is always an array under `loads`, even
        for a single load, so you write one code path for any batch size.

        Each load lands as a **draft**. The response returns a per-load result
        so one bad load never sinks the batch.

        **Idempotency is scoped to drafts.** Re-posting a `source_load_ref`
        while its load is still a draft updates that draft and returns
        `status: "duplicate"` with the same `operfi_load_ref`, so retries and
        redeliveries are safe. Once the broker submits the load it stops being a
        draft, and re-posting the same `source_load_ref` then creates a **new**
        draft. Stop sending a load once you have seen it reach `submitted`, and
        do not blind-replay historical loads.

        Up to 500 loads per request. Split larger batches client-side.
      parameters:
        - $ref: '#/components/parameters/ClientRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLoadsRequest'
      responses:
        '200':
          description: |
            Batch processed. Inspect each entry in `results` for its
            individual `status` (`received`, `duplicate`, or `rejected`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLoadsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenClientRef'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The batch could not be processed as a whole (e.g. exceeds the 500-load cap or is not a valid loads array).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /loads/{ref}:
    get:
      tags: [Loads]
      summary: Get a load's integration status
      operationId: getLoad
      description: |
        Returns the integration status of a load for debugging your
        integration. Returns status only, never funding or payment data.
      parameters:
        - $ref: '#/components/parameters/LoadRef'
      responses:
        '200':
          description: The load's integration status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/LoadNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /loads/{ref}/documents:
    post:
      tags: [Documents]
      summary: Attach a document to a load
      operationId: addLoadDocuments
      description: |
        Upload one or more files to a load. Tag each file with its
        `document_type` so OperFi routes it to the correct customer or carrier
        packet. Max 25 MB per file. Accepted: PDF, PNG, JPG, TIFF.
      parameters:
        - $ref: '#/components/parameters/LoadRef'
        - $ref: '#/components/parameters/ClientRef'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUpload'
            encoding:
              files:
                contentType: application/pdf, image/png, image/jpeg, image/tiff
      responses:
        '200':
          description: Documents accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenClientRef'
        '404':
          $ref: '#/components/responses/LoadNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          description: One or more files use an unsupported document type or file format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /customers:
    get:
      tags: [Reference data]
      summary: List the client's on-file customers
      operationId: listCustomers
      description: |
        Returns the client's credit-approved customers, each with its OperFi
        `customer_id`. Tag a load's `customer_id` from this list so it lands
        already resolved. Only credit-approved customers are returned, because
        only those can be funded on submit.
      parameters:
        - $ref: '#/components/parameters/ClientRef'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenClientRef'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /carriers:
    get:
      tags: [Reference data]
      summary: List the client's on-file carriers
      operationId: listCarriers
      description: |
        Returns the client's on-file carriers, each with its OperFi
        `carrier_id`, MC, and USDOT. Tag a load's `carrier_id` (or send
        `carrier_mc` / `carrier_usdot`) so it lands already resolved. The `dnu`
        flag marks a do-not-use carrier.
      parameters:
        - $ref: '#/components/parameters/ClientRef'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of carriers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarrierList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenClientRef'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /events:
    get:
      tags: [Settlement]
      summary: Poll settlement events for loads you pushed
      operationId: listEvents
      description: |
        An append-only log of what happened to the money on loads you pushed.
        You poll it; OperFi never posts to an endpoint you host.

        Events are immutable and ordered by `seq`, a monotonically increasing
        integer. Store the `next_cursor` you receive and send it back as
        `cursor` on your next call to get only what is new. A correction is
        always a NEW event, never an edit to one you have already seen.

        **Scope.** One broker per request, exactly like `/v1/customers` and
        `/v1/carriers`. In Platform mode, poll once per client ref.

        **Two event types.**
        - `load.settled` — the receivable resolved. `disposition` says how:
          `paid_in_full`, `short_paid`, or `charged_back`. A load that ages out
          unpaid and is charged back to reserve is a `load.settled` carrying
          `charged_back`: there was never a payment to retract.
        - `load.settlement_reversed` — a settlement you were already told about
          is being retracted, typically a returned check or a later chargeback.
          `reverses_seq` points at the `seq` of the `load.settled` event it
          undoes. A load can settle, reverse, and settle again.

        **`source_load_ref` is not unique in this feed.** Re-posting a
        `source_load_ref` after its load has left Draft creates a second,
        genuinely separate OperFi load, and both can settle. Key your records on
        `operfi_load_ref`; treat `source_load_ref` as a label, not an identity.

        **Timing.** Settlement is a daily-cadence fact and the feed is refreshed
        hourly, so polling more often returns nothing new. Events appear only
        after a debtor actually pays, typically weeks after a load is submitted.
      parameters:
        - $ref: '#/components/parameters/ClientRef'
        - $ref: '#/components/parameters/EventCursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of events, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          $ref: '#/components/responses/CursorTooOld'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenClientRef'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandbox/reset:
    post:
      tags: [Sandbox]
      summary: Reset your sandbox account
      operationId: resetSandbox
      description: |
        Deletes every load on **your own** sandbox account and re-seeds the
        standard customer and carrier fixtures. Other partners' sandbox accounts
        are untouched.

        Load references are never recycled: the reference counter deliberately
        survives a reset, so a load created afterwards gets a fresh number rather
        than repeating one you have already stored.

        Returns 404 in production.
      parameters:
        - $ref: '#/components/parameters/ClientRef'
      responses:
        '200':
          description: The account was reset.
          content:
            application/json:
              schema:
                type: object
                required: [reset, loads_deleted]
                properties:
                  reset:
                    type: boolean
                    example: true
                  loads_deleted:
                    type: integer
                    description: How many loads were removed.
                    example: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenClientRef'
        '404':
          description: This is not a sandbox service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandbox/loads/{ref}/advance:
    post:
      tags: [Sandbox]
      summary: Move a sandbox load to a later status
      operationId: advanceSandboxLoad
      description: |
        Drives a sandbox load's status so you can exercise polling and
        state-change handling without a human in the loop. In production only the
        broker can move a load, from inside OperFi.

        `received` and `needs_attention` are both still drafts. Which one a load
        reports depends on whether its required fields and documents are
        complete, exactly as in production, so a load advanced to `received` may
        immediately report `needs_attention` if something is still missing.

        Advancing to `submitted` does not fund, buy, wire, or reserve anything;
        it only changes what `GET /v1/loads/{ref}` reports.

        ## Simulating a settlement

        `settled` and `reversed` emit real events onto your `GET /v1/events`
        feed, so you can test the code that HANDLES a settlement without
        waiting for a debtor to pay.

        ```json
        {"status": "settled", "disposition": "short_paid"}
        {"status": "reversed"}
        ```

        `settled` requires a `disposition` — `paid_in_full`, `short_paid`, or
        `charged_back` — and emits a `load.settled`. `reversed` emits a
        `load.settlement_reversed` retracting the settlement before it, which
        is the case worth testing hardest: your integration has to un-mark a
        load it already reported as paid.

        **Settle only a load you have advanced to `submitted`.** A load that
        was never funded cannot settle, so the sandbox refuses it rather than
        teaching you a lifecycle production does not produce. `reversed` on a
        load with no settlement is refused for the same reason.

        Amounts derive from the `customer_rate` you submitted, so your
        reconciliation runs against your own figure: `paid_in_full` settles it
        exactly, `short_paid` deducts a small remainder to reserve, and
        `charged_back` settles nothing. A load pushed without a rate falls back
        to a usable invoice amount.

        You can settle, reverse, and settle the same load again. Events are
        immutable, so each is a new entry rather than an edit — exactly as in
        production.

        These events are built by the same code that emits real ones, so the
        shape you certify against here is the shape production sends.

        Returns 404 in production.
      parameters:
        - $ref: '#/components/parameters/LoadRef'
        - $ref: '#/components/parameters/ClientRef'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [received, needs_attention, submitted, settled, reversed]
                  description: >-
                    The status to move the load to. `settled` and `reversed`
                    emit settlement events onto your /events feed rather than
                    changing what GET /loads/{ref} reports.
                  example: settled
                disposition:
                  type: string
                  enum: [paid_in_full, short_paid, charged_back]
                  description: >-
                    Required when status is `settled`; ignored otherwise. A
                    `reversed` call is always a chargeback of the settlement
                    before it.
                  example: short_paid
      responses:
        '200':
          description: The load was moved, or a settlement event was emitted.
          content:
            application/json:
              schema:
                type: object
                required: [operfi_load_ref, status]
                properties:
                  operfi_load_ref:
                    type: string
                    example: "4200000000001"
                  status:
                    type: string
                    example: settled
                  event:
                    type: object
                    description: >-
                      Present only for `settled` and `reversed`. Identifies the
                      event now waiting on your /events feed.
                    properties:
                      seq:
                        type: integer
                        format: int64
                        example: 3
                      type:
                        type: string
                        enum: [load.settled, load.settlement_reversed]
                        example: load.settled
                      disposition:
                        type: string
                        example: short_paid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenClientRef'
        '404':
          $ref: '#/components/responses/LoadNotFound'
        '422':
          description: The requested status is not one of the allowed values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Send your API key as a bearer token: `Authorization: Bearer sk_live_...`.
        Use your `sk_test_...` key against the sandbox server. Never expose a key
        in client-side code.

  parameters:
    ClientRef:
      name: OperFi-Client-Ref
      in: header
      required: false
      description: |
        Platform mode only. Identifies which client in your roster this request
        is for. Required on every write in Platform mode; validated against your
        key's authorized-client roster before any write. Ignored in Direct mode.
      schema:
        type: string
        example: "ACME-LOGISTICS-001"
    LoadRef:
      name: ref
      in: path
      required: true
      description: The OperFi load reference (`operfi_load_ref`) returned when the load was created.
      schema:
        type: string
        example: "4200000000001"
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Default 100, max 500.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from a previous response's `next_cursor`. Omit for the first page.
      schema:
        type: string

    EventCursor:
      name: cursor
      in: query
      required: false
      description: >-
        The `next_cursor` from your previous `/events` call. Unlike the opaque
        cursor used elsewhere in this API, this is a monotonically increasing
        integer sequence number: you receive events whose `seq` is strictly
        greater than it. Omit it, or send `0`, to read from the beginning — `0`
        is always valid no matter how far the log has been trimmed.
      schema:
        type: integer
        format: int64
        minimum: 0
        example: 10482

  responses:
    Unauthorized:
      description: Missing or invalid API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: unauthorized
              message: Missing or invalid API key.
              request_id: req_01HZ8XK2P3
    ForbiddenClientRef:
      description: The `OperFi-Client-Ref` is not in your key's authorized-client roster.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: forbidden_client_ref
              message: client_ref "ACME-LOGISTICS-001" is not authorized for this key.
              field: OperFi-Client-Ref
              request_id: req_01HZ8XK2P4
    CursorTooOld:
      description: >-
        The `cursor` you sent is older than the retained event window, so the
        events between it and the oldest retained event no longer exist and
        cannot be replayed. Restart from `cursor=0` and reconcile by
        `operfi_load_ref`. Sending `cursor=0` never produces this error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: cursor_too_old
              message: >-
                That cursor is older than the retained event window. Restart from
                cursor=0 and reconcile by operfi_load_ref.
              field: cursor
              request_id: req_01HZ8XK2P9
    LoadNotFound:
      description: No load exists with that reference for this client.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: load_not_found
              message: No load found with ref "4200000000001".
              request_id: req_01HZ8XK2P5
    PayloadTooLarge:
      description: The request or a file exceeds the allowed size.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: payload_too_large
              message: File exceeds the 25 MB limit.
              request_id: req_01HZ8XK2P6
    RateLimited:
      description: Too many requests. Retry after the period in the `Retry-After` header.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limited
              message: Rate limit exceeded. Retry after 30 seconds.
              request_id: req_01HZ8XK2P7
    InternalError:
      description: An unexpected error occurred. Safe to retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal_error
              message: An unexpected error occurred.
              request_id: req_01HZ8XK2P8

  schemas:

    CreateLoadsRequest:
      type: object
      required: [loads]
      properties:
        loads:
          type: array
          minItems: 1
          maxItems: 500
          description: The loads to create. Max 500 per request.
          items:
            $ref: '#/components/schemas/LoadInput'

    LoadInput:
      type: object
      required: [source_load_ref]
      description: |
        A single load. `source_load_ref` is required and is the idempotency key.
        Customer and carrier may be sent by OperFi ID (preferred; lands
        resolved) or by raw value (name / MC / USDOT), resolved or surfaced as
        a warning for the broker to resolve in-portal). Rates and references are
        needed to submit, but a load missing them still lands as a draft.
      properties:
        source_load_ref:
          type: string
          description: >-
            Your own unique load or invoice number, and the idempotency key.
            Re-sending it while the load is still a draft returns that same
            draft. Re-sending it after the broker has submitted the load creates
            a new draft. See the endpoint description.
          example: "TMS-88231"
        customer_id:
          type: string
          description: OperFi customer ID from `GET /v1/customers`. Preferred; lands resolved.
          example: "3773785000000956013"
        customer_fv_id:
          type: string
          description: >-
            The customer's FactorView Company ID, returned as `fv_company_id` by
            `GET /v1/customers`. Exact match only. If it does not match, the load
            still lands but the customer is left unresolved with a
            `customer_fv_id_not_found` warning -- OperFi does NOT fall back to
            `customer_name`, even an exactly matching one. Send this only when
            you hold a real value; not every customer has one.
          example: "FV-SBX-1001"
        customer_name:
          type: string
          description: Raw customer name, used when neither `customer_id` nor `customer_fv_id` is supplied. Resolved against the client's on-file customers; an unmatched name comes back as a warning.
          example: "ABC Shipping LLC"
        customer_reference_number:
          type: string
          description: The customer's reference / PO number for this load.
          example: "PO-44821"
        customer_rate:
          type: number
          format: double
          description: Amount billed to the customer, in USD.
          example: 2400.00
        carrier_id:
          type: string
          description: OperFi carrier (vendor) ID from `GET /v1/carriers`. Preferred; lands resolved.
          example: "3773785000000370055"
        carrier_mc:
          type: string
          description: Carrier MC number, used when `carrier_id` is not supplied. At least one of `carrier_mc` / `carrier_usdot` is needed to resolve a carrier by value.
          example: "123456"
        carrier_usdot:
          type: string
          description: Carrier USDOT number, used when `carrier_id` is not supplied.
          example: "987654"
        carrier_rate:
          type: number
          format: double
          description: Amount paid to the carrier, in USD.
          example: 2000.00
        carrier_factoring_invoice:
          type: string
          description: The carrier's factoring invoice number for this load.
          example: "INV-55812"
        load_rate_confirmation_number:
          type: string
          description: The rate confirmation number for this load.
          example: "RC-77231"
        payment_terms:
          type: string
          description: >-
            Effectively read-only. Whenever a carrier resolves, OperFi
            overwrites this with the pay terms on file for that carrier in the
            client's account, and clears it if that carrier has none on file. A
            value you send survives only when no carrier resolves at all. Carrier
            pay terms are owned by the carrier record, not by the load; to change
            them, change the carrier.
          example: "Net 30"
        load_comments:
          type: string
          description: Optional free-text notes for the broker.
          example: "Detention approved, see attached."
        source_payload:
          type: object
          additionalProperties: true
          description: Optional. Your original record for this load, stored verbatim. Useful for fields OperFi does not map and for the broker's reference during resolution.

    CreateLoadsResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: One result per submitted load, in request order.
          items:
            $ref: '#/components/schemas/LoadResult'

    LoadResult:
      type: object
      required: [source_load_ref, status]
      properties:
        source_load_ref:
          type: string
          description: Echoes the `source_load_ref` you sent, so you can correlate results.
          example: "TMS-88231"
        status:
          type: string
          enum: [received, duplicate, rejected]
          description: |
            - `received`: the load landed as a draft (possibly with warnings).
            - `duplicate`: a draft for this `source_load_ref` already existed; the existing one is returned.
            - `rejected`: the payload was malformed and no draft was created (see `errors`).
          example: received
        operfi_load_ref:
          type: string
          description: The OperFi load reference. Present for `received` and `duplicate`. Use it for document upload and status checks.
          example: "4200000000001"
        warnings:
          type: array
          description: Soft issues the broker resolves in-portal. The draft still exists. Empty when none.
          items:
            $ref: '#/components/schemas/Issue'
        errors:
          type: array
          description: Hard errors that prevented creation. Present only when `status` is `rejected`.
          items:
            $ref: '#/components/schemas/Issue'

    LoadStatus:
      type: object
      required: [operfi_load_ref, source_load_ref, status]
      properties:
        operfi_load_ref:
          type: string
          example: "4200000000001"
        source_load_ref:
          type: string
          example: "TMS-88231"
        status:
          type: string
          enum: [received, needs_attention, submitted]
          description: |
            - `received`: landed as a draft, no outstanding issues.
            - `needs_attention`: the broker needs to resolve something (see `warnings`).
            - `submitted`: the broker has submitted the load for factoring.
          example: needs_attention
        warnings:
          type: array
          description: Outstanding items the broker needs to resolve. Empty when none.
          items:
            $ref: '#/components/schemas/Issue'

    DocumentUpload:
      type: object
      required: [document_type, files]
      properties:
        document_type:
          type: string
          enum: [rate_confirmation, bol, carrier_invoice, customer_invoice, other]
          description: How OperFi should classify and route the uploaded files.
        files:
          type: array
          minItems: 1
          description: One or more files. Max 25 MB each. PDF, PNG, JPG, or TIFF.
          items:
            type: string
            format: binary

    DocumentUploadResult:
      type: object
      required: [operfi_load_ref, uploaded]
      properties:
        operfi_load_ref:
          type: string
          example: "4200000000001"
        uploaded:
          type: integer
          description: Number of files accepted.
          example: 2
        document_type:
          type: string
          example: rate_confirmation

    CustomerList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page. Null on the last page.
          example: null

    Customer:
      type: object
      required: [customer_id, name]
      properties:
        customer_id:
          type: string
          example: "3773785000000956013"
        name:
          type: string
          example: "ABC Shipping LLC"
        fv_company_id:
          type: string
          description: >-
            The customer's FactorView Company ID, or an empty string when they do
            not have one. Pass it back as `customer_fv_id` on a load to identify
            this customer exactly. Expect it to be empty for a meaningful share
            of customers; fall back to `customer_id` or `customer_name` then.
          example: "FV-SBX-1001"
        credit_status:
          type: string
          description: Always `approved` in this list (only approved customers are returned).
          example: approved

    CarrierList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Carrier'
        next_cursor:
          type: string
          nullable: true
          description: Pass as `cursor` to fetch the next page. Null on the last page.
          example: null

    Carrier:
      type: object
      required: [carrier_id, name]
      properties:
        carrier_id:
          type: string
          example: "3773785000000370055"
        name:
          type: string
          example: "Brennan Trucking Inc"
        mc:
          type: string
          nullable: true
          example: "123456"
        usdot:
          type: string
          nullable: true
          example: "987654"
        dnu:
          type: boolean
          description: True if this carrier is marked do-not-use for this client.
          example: false

    Issue:
      type: object
      required: [code, message]
      description: A single warning or error.
      properties:
        code:
          type: string
          description: A stable machine-readable code.
          example: customer_not_resolved
        message:
          type: string
          description: A human-readable explanation.
          example: No exact customer match; resolve in the OperFi portal.
        field:
          type: string
          description: The input field the issue relates to, when applicable.
          example: customer_name

    EventList:
      type: object
      required: [events, next_cursor, has_more]
      properties:
        events:
          type: array
          description: Events with `seq` greater than your cursor, oldest first.
          items:
            $ref: '#/components/schemas/SettlementEvent'
        next_cursor:
          type: integer
          format: int64
          description: >-
            Send this as `cursor` on your next call. Unchanged from what you sent
            when the page is empty, so an idle feed never moves you backwards.
          example: 10611
        has_more:
          type: boolean
          description: >-
            True when more events were available than `limit` allowed. Keep
            polling immediately while this is true; otherwise wait for the next
            hourly refresh.
          example: false

    SettlementEvent:
      type: object
      required: [seq, type, operfi_load_ref, disposition, occurred_at, recorded_at]
      description: >-
        Immutable. All money fields are decimal STRINGS, never JSON numbers, so
        that cent values survive a round trip through languages that would
        otherwise parse them as floats.
      properties:
        seq:
          type: integer
          format: int64
          description: Monotonically increasing. Your cursor position.
          example: 10482
        type:
          type: string
          enum: [load.settled, load.settlement_reversed]
          description: >-
            `load.settled` — the receivable resolved. `load.settlement_reversed`
            — a settlement you were already told about is being retracted.
          example: load.settled
        operfi_load_ref:
          type: string
          description: The load this event is about. Key your records on this.
          example: "4200000000001"
        source_load_ref:
          type: string
          description: >-
            Your own reference from when you pushed the load. NOT unique in this
            feed — see the endpoint description. Empty if the load did not come
            from you.
          example: TMS-88231
        disposition:
          type: string
          enum: [paid_in_full, short_paid, charged_back]
          description: >-
            What actually happened. `short_paid` means the debtor paid less than
            the invoice and the difference was charged to reserve. `charged_back`
            means the receivable was recoursed rather than collected.
          example: short_paid
        invoice_amount:
          type: string
          description: The receivable's face value. Present on `load.settled`.
          example: "1778.33"
        amount_settled:
          type: string
          description: >-
            What the debtor actually paid. Present on `load.settled`. Zero on a
            charged-back load that was never paid.
          example: "1776.81"
        variance:
          type: string
          description: >-
            `amount_settled` minus `invoice_amount`. Negative on a short pay,
            positive on an overpayment, `"0.00"` on a clean settlement.
          example: "-1.52"
        amount_reversed:
          type: string
          description: >-
            Present on `load.settlement_reversed` only. The amount being
            retracted — the settled amount, not the invoice face value.
          example: "1776.81"
        reverses_seq:
          type: integer
          format: int64
          description: >-
            Present on `load.settlement_reversed` only. The `seq` of the
            `load.settled` event this retracts. Always points at a settlement,
            never at another reversal.
          example: 10482
        occurred_at:
          type: string
          format: date-time
          description: >-
            When the money moved, in UTC. Reconcile on this. It can be earlier
            than `recorded_at` by hours or days.
          example: "2026-08-14T16:00:00Z"
        recorded_at:
          type: string
          format: date-time
          description: When OperFi appended the event, in UTC. Ordering follows `seq`, not this.
          example: "2026-08-15T03:12:00Z"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - forbidden_client_ref
                - validation_error
                - customer_not_resolved
                - carrier_not_resolved
                - duplicate_load_ref
                - load_not_found
                - unsupported_document_type
                - payload_too_large
                - rate_limited
                - internal_error
              example: validation_error
            message:
              type: string
              example: carrier_rate must be a positive number.
            field:
              type: string
              description: The offending field, when applicable.
              example: carrier_rate
            request_id:
              type: string
              description: Echo this when contacting OperFi support.
              example: req_01HZ8XK2P3
