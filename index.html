<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OperFi Partner API</title>
  <!-- The OperFi mark on a charcoal tile. A tile rather than the logo as-is
       because a favicon is judged at 16px: the logo's grey frame turns to mush
       at that size, and a transparent mark disappears against dark browser
       chrome. Replaces a blank `data:,` icon that existed only to stop the
       browser requesting /favicon.ico and 404ing. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#1d1d1f" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    redoc { display: block; }

    /* Redoc breaks long tokens anywhere by default, which splits identifiers
       mid-word in tables (customer_id rendering as "custom / er_id"). An API
       reference must never show a field name a reader has to reassemble, and
       must never invite a bad copy-paste. Keep identifiers whole. */
    redoc code,
    redoc span[class*="token"],
    redoc td code {
      word-break: keep-all;
      overflow-wrap: normal;
      white-space: nowrap;
    }

    /* With identifiers unbreakable, a wide markdown table must scroll rather
       than crush its columns. Applies only to prose tables in the description,
       not to Redoc's own schema rendering. */
    redoc .redoc-markdown table {
      display: block;
      width: fit-content;
      max-width: 100%;
      overflow-x: auto;
    }

    /* Fenced code blocks still need to wrap normally; only inline tokens are
       protected above. */
    redoc pre code {
      white-space: pre;
    }
  </style>
</head>
<body>
  <!-- Brand colors come from the logo: gold #FFCA08, grey #939598, and the
       favicon's charcoal #1d1d1f. Logo gold is 1.5:1 on white, unreadable as
       text, so it is never used on the light panes; links take a darkened gold
       (#7a5f00, 6:1) and the charcoal code panel carries the brand instead. -->
  <redoc
    spec-url="openapi.yaml"
    expand-responses="200"
    required-props-first="true"
    sort-props-alphabetically="false"
    hide-download-button="false"
    theme='{
      "colors": { "primary": { "main": "#1d1d1f" } },
      "typography": {
        "fontFamily": "Inter, system-ui, sans-serif",
        "headings": { "fontFamily": "Inter, system-ui, sans-serif", "fontWeight": "700" },
        "code": { "fontFamily": "ui-monospace, SFMono-Regular, Menlo, monospace", "color": "#1d1d1f", "backgroundColor": "#f3f1ec" },
        "links": { "color": "#7a5f00", "hover": "#1d1d1f" }
      },
      "sidebar": { "width": "300px", "backgroundColor": "#f6f6f4", "activeTextColor": "#1d1d1f" },
      "rightPanel": { "backgroundColor": "#1d1d1f" },
      "logo": { "gutter": "24px 32px" }
    }'
  ></redoc>
  <!-- Pinned, never `latest`. `latest` moved to Redoc 3 on 2026-10-14, which
       dropped the window.Redoc global and the <redoc> tag auto-render, and
       this page went blank with no console error. -->
  <script src="https://cdn.redoc.ly/redoc/v2.5.1/bundles/redoc.standalone.js"></script>
</body>
</html>
